name: Build and verify VIA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - name: Verify bundled hand model
        run: python3 ../scripts/verify_model.py
      - name: Compile, test and lint both apps
        run: >-
          bash ./gradlew --no-daemon --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8'
          :app-terminal:assembleDebug :app-mobile:assembleDebug
          :app-terminal:testDebugUnitTest :app-mobile:testDebugUnitTest
          :core-storage:testDebugUnitTest :core-model:testDebugUnitTest :core-hardware:testDebugUnitTest
          :app-terminal:lintDebug :app-mobile:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-and-test-results
          path: |
            android/app-*/build/outputs/apk/debug/*.apk
            android/**/build/reports/tests/
            android/**/build/reports/lint-results-debug.*
            android/**/build/test-results/
  print-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'trimesh>=4,<5' 'numpy>=1.26,<3'
      - run: python scripts/check_print_meshes.py
