name: Verify documentation and gallery
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'media/render-manifest.json'
      - 'media/renders/**'
      - 'scripts/build_part_catalog.py'
      - 'scripts/check_documentation.py'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'media/**'
      - 'scripts/build_part_catalog.py'
      - 'scripts/check_documentation.py'
      - '.github/workflows/documentation.yml'
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check links, figure captions and PNG dimensions
        run: python3 scripts/check_documentation.py
      - name: Check reproducible part catalog
        run: |
          python3 scripts/build_part_catalog.py
          git diff --exit-code -- docs/part-catalog.md
